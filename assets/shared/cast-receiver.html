<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- Google Cast receiver for live streams from the apps (see assets/shared/cast.js). Runs on the Chromecast /
     Android TV, registered as a custom receiver in the Google Cast SDK Developer Console with this address.
     The Cast receiver framework must come from www.gstatic.com; it talks to the device over local sockets. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://www.gstatic.com; img-src 'self' data: blob: https://www.gstatic.com; media-src 'self' blob: mediastream:; connect-src 'self' https: wss: ws://localhost:* ws://127.0.0.1:*; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Live-Stream</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#e5e7eb;font-family:system-ui,Roboto,sans-serif;overflow:hidden}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#idle{position:fixed;inset:0;display:grid;place-content:center;text-align:center;gap:12px}
#idle h1{margin:0;font-size:44px;font-weight:600}
#idle p{margin:0;font-size:24px;color:#9ca3af}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:#22d3ee;margin-inline-end:10px;animation:p 1.4s ease-in-out infinite}
@keyframes p{50%{opacity:.25}}
#log{position:fixed;left:24px;bottom:24px;max-width:46%;max-height:45%;overflow:hidden;font:14px/1.35 ui-monospace,monospace;background:rgba(0,0,0,.7);color:#a7f3d0;padding:10px 12px;border-radius:8px;white-space:pre-wrap}
[hidden]{display:none!important}
</style>
</head>
<body>
<video id="video" autoplay playsinline></video>
<div id="idle"><h1><span class="dot"></span><span id="idleTitle">Bereit für den Stream</span></h1><p id="idleText">Starte das Streamen in der App auf dem Handy.</p></div>
<pre id="log" hidden></pre>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<script src="cast-receiver.js"></script>
</body>
</html>
