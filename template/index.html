<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- Tool metadata: read by scripts/build-index.mjs for the start page and README -->
<title>Neues Tool</title>
<meta name="description" content="Ein Satz, was das Tool macht – erscheint auf der Startseite.">
<meta name="tool:tags" content="Tag 1, Tag 2">
<meta name="tool:order" content="100">
<link rel="stylesheet" href="../assets/base.css">
<style>
/* Page-specific styles only. Shared tokens and components live in assets/base.css. */
main{max-width:1100px;margin-inline:auto;padding:12px;display:grid;gap:12px}
</style>
</head>
<body>
<header>
  <h1>Neues Tool</h1>
  <p class="sub">Kurze Unterzeile.</p>
</header>

<main>
  <section class="card" aria-labelledby="h-main">
    <h2 id="h-main">Bereich</h2>
    <div class="row">
      <button class="btn primary" id="btnDemo">Beispiel</button>
    </div>
  </section>
</main>

<details class="help card">
  <summary>Anleitung &amp; Hinweise</summary>
  <p>Wofür ist das Tool, wie benutzt man es?</p>
  <h3>Bedienung</h3>
  <ul>
    <li>…</li>
  </ul>
</details>

<footer>Läuft vollständig im Browser · Einstellungen werden lokal gespeichert</footer>

<script src="../assets/common.js"></script>
<script>
(function(){
'use strict';
// localStorage key convention: <folder-name>.<what>.v1
const LS='new-tool.settings.v1';
const settings=Tools.load(LS,{count:0});
Tools.$('btnDemo').addEventListener('click',()=>{
  settings.count++;
  Tools.save(LS,settings);
  Tools.toast('Geklickt: '+settings.count+'×');
});
})();
</script>
</body>
</html>
