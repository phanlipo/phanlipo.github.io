# Weekly update PRs for GitHub Actions and the test tooling (package.json).
# The libraries the pages use (assets/vendor/) are checked separately by
# .github/workflows/vendor-check.yml. Every Dependabot PR runs the test suite.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'CI'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      test-tooling:
        patterns: ['*']
    commit-message:
      prefix: 'Tests'
