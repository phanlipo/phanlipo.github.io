# Monthly update PRs for GitHub Actions and the test tooling (package.json).
# The libraries the pages use (assets/vendor/) are checked separately by
# .github/workflows/vendor-check.yml. Every Dependabot PR runs the test suite.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Only versions released at least 7 days ago: malicious releases are usually found within days
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'CI'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Only versions released at least 7 days ago: malicious releases are usually found within days
    cooldown:
      default-days: 7
    groups:
      test-tooling:
        patterns: ['*']
    commit-message:
      prefix: 'Tests'
