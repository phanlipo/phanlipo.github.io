# Monthly code scanning of the own code (JavaScript in the pages and scripts) and of the workflows
# with CodeQL. Results: Security → Code scanning. The libraries in assets/vendor/ are not scanned here
# (minified third-party code) – they are checked by "Bibliotheken prüfen" (vendor-check.yml).
# If "CodeQL default setup" is enabled in the repository settings, disable it – it conflicts with this file.
name: CodeQL

on:
  schedule:
    - cron: '23 5 5 * *'   # 5th of every month, 05:23 UTC
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - assets/vendor
              - node_modules
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
