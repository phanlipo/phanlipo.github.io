# Regenerates the tool list (start page + README) and the shared footer in every page
# and commits the result, so generated parts are always current after a push.
name: Tool-Liste & Fußzeile aktualisieren

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tool-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build generated parts
        run: node scripts/build-index.mjs
      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Generated parts already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update generated tool list and footer"
          git push
