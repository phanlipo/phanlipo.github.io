# Rebuilds the tool list on the start page and in README.md from the tool folders
# and commits the result, so the list is always current after a push.
name: Tool-Liste aktualisieren

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tool-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build tool list
        run: node scripts/build-index.mjs
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html README.md; then
            echo "Tool list already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md
          git commit -m "Update tool list"
          git push
