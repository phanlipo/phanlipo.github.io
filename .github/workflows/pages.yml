# Publishes the site to GitHub Pages – only the files the pages need (scripts/site.mjs),
# not README.md, scripts/, tests/ … (those cannot carry noindex and stay on github.com).
# Requires: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Alongside: the SBOM of the shipped libraries (sbom.cdx.json) is attested, kept as a workflow
# artifact and sent to the dependency graph (→ Dependabot alerts for assets/vendor/ too).
name: GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One deployment at a time; a running one is not cancelled
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Same generated state the tests ran against
      - name: Build generated files
        run: node scripts/build.mjs
      - name: Collect published files
        run: node scripts/site.mjs _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # SBOM of the published libraries: signed attestation (subject = the shipped vendor files),
  # workflow artifact and dependency graph. Not published on the site itself.
  sbom:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write        # dependency submission
      id-token: write        # attestation signature
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build generated files
        run: node scripts/build.mjs
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'assets/vendor/**'
          sbom-path: sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90
      - name: Send libraries to the dependency graph
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sbom.mjs --submit

  # Afterwards: test the published site
  live-test:
    needs: deploy
    permissions:
      contents: read
    uses: ./.github/workflows/live-test.yml # zizmor: ignore[self-repository]
