# Checks the GitHub workflows for security problems (zizmor: unpinned actions, too broad token
# permissions, template injection, leaked credentials …) – on every pull request (takes seconds),
# so it can be a required check.
name: Workflows prüfen

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: Workflows prüfen
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run 'zizmor==1.31.1' --format=github .github
