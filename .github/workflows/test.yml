# Runs the browser tests (tests/, Playwright) for every pull request and every push to main.
# In CI every test gets one retry (playwright.config.mjs); tests that pass only on the retry are listed
# as warnings and in the job summary (tests/flaky-summary.mjs) – fix them like red tests.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite is split over 3 runners in parallel (Playwright --shard), each with 4 workers.
  shard:
    name: Tests ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Only the headless shell (all the tests use) and no --with-deps: the runner image already has
      # Chromium's libraries, --with-deps only added extra fonts via apt – from a slow Ubuntu mirror
      # that took up to 7 minutes.
      - run: npx playwright install --only-shell chromium
      # Test the generated state (tool list, footer, manifests, sw.js) even if the
      # "build" Action has not committed it yet.
      - name: Build generated files
        run: node scripts/build.mjs
      - name: Run tests
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/3
      - name: List flaky tests
        id: flaky
        if: always()
        run: node tests/flaky-summary.mjs
      # On failure – and when a test was flaky, so its trace can be looked at although the run is green.
      # Only a helper: if GitHub's artifact storage fails (November 2026: hung 10 minutes, then failed),
      # the job keeps the result of the tests instead of turning red.
      - name: Upload report
        if: failure() || steps.flaky.outputs.flaky == 'true'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

  # Basic check of every page in WebKit (Safari, iPhone) and Firefox (tests/browsers.spec.mjs).
  # On macOS: there both browsers run without extra system packages – on Ubuntu, WebKit needs GTK 4,
  # GStreamer … via apt (--with-deps), and the Ubuntu mirror sometimes took over 15 minutes for that.
  # WebKit on macOS is also closer to Safari.
  # One runner per engine: macos-latest has only 3 CPUs, and with both engines on one runner the service
  # workers sometimes did not finish installing in time ("installing" after 20 s). Each engine now has
  # its runner to itself, with 2 workers.
  engines:
    name: ${{ matrix.engine == 'webkit' && 'WebKit' || 'Firefox' }}
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install ${{ matrix.engine }}
      - name: Build generated files
        run: node scripts/build.mjs
      - name: Run tests
        run: npx playwright test --project=${{ matrix.engine }} --workers=2
      - name: List flaky tests
        id: flaky
        if: always()
        run: node tests/flaky-summary.mjs
      - name: Upload report
        if: failure() || steps.flaky.outputs.flaky == 'true'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.engine }}
          path: playwright-report/
          retention-days: 14

  # Static check of our own code (eslint.config.mjs): misspelled names, unused variables, duplicate keys
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint

  # The check "test" that the branch protection of main requires: green only when every part is green.
  test:
    needs: [shard, engines, lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All parts passed
        env:
          SHARDS: ${{ needs.shard.result }}
          ENGINES: ${{ needs.engines.result }}
          LINT: ${{ needs.lint.result }}
        run: |
          echo "Chromium: $SHARDS, WebKit & Firefox: $ENGINES, ESLint: $LINT"
          test "$SHARDS" = success && test "$ENGINES" = success && test "$LINT" = success
