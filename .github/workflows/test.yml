# Runs the browser tests (tests/, Playwright) for every pull request and every push to main.
# Pull requests run only the tests their changes need (tests/select.mjs: one app → its tests, shared
# basics → everything, documentation → none); pushes to main and manual runs always run everything,
# so whatever the selection misses turns main red right after the merge.
# In CI every test gets one retry (playwright.config.mjs); tests that pass only on the retry are listed
# as warnings and in the job summary (tests/flaky-summary.mjs) – fix them like red tests.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which tests to run: mode all | some (grep) | none, and over how many runners
  select:
    name: Tests auswählen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      grep: ${{ steps.select.outputs.grep }}
      shards: ${{ steps.select.outputs.shards }}
      total: ${{ steps.select.outputs.total }}
    steps:
      # The merge commit of the PR: its first parent is the current main, so HEAD^1...HEAD are exactly
      # the PR's changes
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # select.mjs reads every app's sw.js to see which shared files and libraries it uses
      - run: node scripts/build.mjs
      - name: Select tests
        id: select
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            node tests/select.mjs --base HEAD^1
          else
            node tests/select.mjs --all
          fi

  # The suite is split over up to 3 runners in parallel (Playwright --shard), each with 4 workers.
  shard:
    name: Tests ${{ matrix.shard }}/${{ needs.select.outputs.total }}
    needs: select
    if: needs.select.outputs.mode != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Only the headless shell (all the tests use) and no --with-deps: the runner image already has
      # Chromium's libraries, --with-deps only added extra fonts via apt – from a slow Ubuntu mirror
      # that took up to 7 minutes.
      - run: npx playwright install --only-shell chromium
      # Test the generated state (tool list, footer, manifests, sw.js) even if the
      # "build" Action has not committed it yet.
      - name: Build generated files
        run: node scripts/build.mjs
      - name: Run tests
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.select.outputs.total }}
          GREP: ${{ needs.select.outputs.grep }}
        run: npx playwright test --project=chromium --shard="$SHARD" ${GREP:+--grep "$GREP"}
      - name: List flaky tests
        id: flaky
        if: always()
        run: node tests/flaky-summary.mjs
      # On failure – and when a test was flaky, so its trace can be looked at although the run is green.
      # Only a helper: if GitHub's artifact storage fails (November 2026: hung 10 minutes, then failed),
      # the job keeps the result of the tests instead of turning red.
      - name: Upload report
        if: failure() || steps.flaky.outputs.flaky == 'true'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

  # Basic check of every page in WebKit (Safari, iPhone) and Firefox (tests/browsers.spec.mjs).
  # On macOS: there both browsers run without extra system packages – on Ubuntu, WebKit needs GTK 4,
  # GStreamer … via apt (--with-deps), and the Ubuntu mirror sometimes took over 15 minutes for that.
  # WebKit on macOS is also closer to Safari.
  # One runner per engine: macos-latest has only 3 CPUs, and with both engines on one runner the service
  # workers sometimes did not finish installing in time ("installing" after 20 s). Each engine now has
  # its runner to itself, with 2 workers.
  engines:
    name: ${{ matrix.engine == 'webkit' && 'WebKit' || 'Firefox' }}
    needs: select
    if: needs.select.outputs.mode != 'none'
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install ${{ matrix.engine }}
      - name: Build generated files
        run: node scripts/build.mjs
      - name: Run tests
        env:
          GREP: ${{ needs.select.outputs.grep }}
        run: npx playwright test --project=${{ matrix.engine }} --workers=2 ${GREP:+--grep "$GREP"}
      - name: List flaky tests
        id: flaky
        if: always()
        run: node tests/flaky-summary.mjs
      - name: Upload report
        if: failure() || steps.flaky.outputs.flaky == 'true'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.engine }}
          path: playwright-report/
          retention-days: 14

  # Static check of our own code (eslint.config.mjs): misspelled names, unused variables, duplicate keys
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint

  # The check "test" that the branch protection of main requires: green only when every part is green
  # (the browser tests may be skipped only when the selection needs none).
  test:
    needs: [select, shard, engines, lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All parts passed
        env:
          SELECT: ${{ needs.select.result }}
          MODE: ${{ needs.select.outputs.mode }}
          SHARDS: ${{ needs.shard.result }}
          ENGINES: ${{ needs.engines.result }}
          LINT: ${{ needs.lint.result }}
        run: |
          echo "Selection: $SELECT ($MODE), Chromium: $SHARDS, WebKit & Firefox: $ENGINES, ESLint: $LINT"
          test "$SELECT" = success && test "$LINT" = success
          if [ "$MODE" = none ]; then exit 0; fi
          test "$SHARDS" = success && test "$ENGINES" = success
