# Runs the browser tests (tests/, Playwright) for every pull request and every push to main.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite is split over 3 runners in parallel (Playwright --shard), each with 4 workers.
  shard:
    name: Tests ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Only the headless shell (all the tests use) and no --with-deps: the runner image already has
      # Chromium's libraries, --with-deps only added extra fonts via apt – from a slow Ubuntu mirror
      # that took up to 7 minutes.
      - run: npx playwright install --only-shell chromium
      # Test the generated state (tool list, footer, manifests, sw.js) even if the
      # "build" Action has not committed it yet.
      - name: Build generated files
        run: node scripts/build.mjs
      - name: Run tests
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/3
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

  # Basic check of every page in WebKit (Safari, iPhone) and Firefox (tests/browsers.spec.mjs).
  # On macOS: there both browsers run without extra system packages – on Ubuntu, WebKit needs GTK 4,
  # GStreamer … via apt (--with-deps), and the Ubuntu mirror sometimes took over 15 minutes for that.
  # WebKit on macOS is also closer to Safari.
  engines:
    name: WebKit & Firefox
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install webkit firefox
      - name: Build generated files
        run: node scripts/build.mjs
      # macos-latest has 3 CPUs: with the 4 workers of playwright.config (sized for the 4-core Ubuntu
      # runners) the service workers of WebKit and Firefox sometimes did not finish installing in time
      - name: Run tests
        run: npx playwright test --project=webkit --project=firefox --workers=2
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-engines
          path: playwright-report/
          retention-days: 14

  # The check "test" that the branch protection of main requires: green only when every part is green.
  test:
    needs: [shard, engines]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All parts passed
        env:
          SHARDS: ${{ needs.shard.result }}
          ENGINES: ${{ needs.engines.result }}
        run: |
          echo "Chromium: $SHARDS, WebKit & Firefox: $ENGINES"
          test "$SHARDS" = success && test "$ENGINES" = success
