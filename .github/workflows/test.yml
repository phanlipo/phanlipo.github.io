# Runs the browser tests (tests/, Playwright) for every pull request and every push to main.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite is split over 3 runners in parallel (Playwright --shard), each with 4 workers.
  shard:
    name: Tests ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Only the headless shell (all the tests use) and no --with-deps: the runner image already has
      # Chromium's libraries, --with-deps only added extra fonts via apt – from a slow Ubuntu mirror
      # that took up to 7 minutes.
      - run: npx playwright install --only-shell chromium
      # Test the generated state (tool list, footer, manifests, sw.js) even if the
      # "build" Action has not committed it yet.
      - name: Build generated files
        run: node scripts/build.mjs
      - name: Run tests
        run: npx playwright test --shard=${{ matrix.shard }}/3
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

  # The check "test" that the branch protection of main requires: green only when every part is green.
  test:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All parts passed
        env:
          RESULT: ${{ needs.shard.result }}
        run: |
          echo "Tests: $RESULT"
          test "$RESULT" = success
