# Regenerates tool list, footer, head links, PWA manifests and service workers
# and commits the result, so generated parts are always current after a push.
name: Generierte Dateien aktualisieren

on:
  # Not on main: main is protected and only receives already-built PRs
  # (the bot could not push there). The test workflow also builds before testing.
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Credentials stay: this job pushes the generated files (no artifacts are uploaded)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Build generated parts
        run: node scripts/build.mjs
      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Generated parts already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update generated files"
          git push
