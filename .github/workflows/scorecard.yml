# Monthly OpenSSF Scorecard of this repository (pinned actions, token permissions, branch protection …).
# Results: Security → Code scanning. Not published to the public Scorecard API (publish_results: false).
name: OpenSSF Scorecard

on:
  schedule:
    - cron: '41 4 7 * *'   # 7th of every month, 04:41 UTC
  workflow_dispatch:

permissions: {}

jobs:
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
